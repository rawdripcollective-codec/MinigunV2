services:
  - type: web
    name: minigunv2-docs
    env: static
    buildCommand: echo "Building static site from repository root"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REPO_ROOT
        value: /opt/render/project/src
      - key: PROJECT_NAME
        value: MinigunV2
      - key: TERRAFORM_VERSION
        value: "1.5.0"